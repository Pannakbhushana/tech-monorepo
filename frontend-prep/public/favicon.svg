<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle with Gradient -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <!-- Glowing inner circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="24" />
  <!-- Logo Icon: Stylized curly braces -->
  <path d="M 180 150 C 150 150, 130 180, 130 220 C 130 245, 110 256, 90 256 C 110 256, 130 267, 130 292 C 130 332, 150 362, 180 362" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 332 150 C 362 150, 382 180, 382 220 C 382 245, 402 256, 422 256 C 402 256, 382 267, 382 292 C 382 332, 362 362, 332 362" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" filter="url(#glow)" />
  <!-- Green Checkmark inside the braces -->
  <path d="M 210 260 L 240 290 L 305 215" fill="none" stroke="#10b981" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>